[package]
name = "omarchy-volumio"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Volumio JSON-lines bridge for the Omarchy shell"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "time", "sync"] }

[profile.release]
lto = "thin"
strip = true

